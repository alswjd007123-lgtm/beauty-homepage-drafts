<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뷰티샵 홈페이지 시안</title>
<meta name="description" content="피부관리·네일·헤어 뷰티샵 홈페이지 시안 3종">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f6ece6;--bg2:#e8e6f3;--ink:#2a2530;--sub:#6b6372;--glass:rgba(255,255,255,.45);--edge:rgba(255,255,255,.7)}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:'Gowun Dodum',sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:64px 16px;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(90px);z-index:-1;opacity:.55}
body::before{background:#f3b9a7;top:-120px;left:-100px}
body::after{background:#b9b3ea;bottom:-140px;right:-100px}
main{max-width:1000px;margin:0 auto}
h1{font-size:clamp(26px,4vw,38px);font-weight:400;text-align:center}
.lead{text-align:center;color:var(--sub);margin:12px 0 44px}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{display:flex;flex-direction:column;gap:6px;padding:28px 26px;border-radius:24px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 30px -16px rgba(60,40,70,.3);color:inherit;text-decoration:none;transition:transform .3s,box-shadow .3s}
.card:hover,.card:focus-visible{transform:translateY(-6px);box-shadow:0 20px 40px -18px rgba(60,40,70,.4)}
.no{font-size:13px;color:var(--sub)}
.card h2{font-size:22px;font-weight:400}
.card p{color:var(--sub);font-size:15px;line-height:1.6}
.go{margin-top:10px;font-size:14px}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
  <h1>뷰티샵 홈페이지 시안</h1>
  <p class="lead">세 가지 시안을 눌러 확인해 보세요.</p>
  <section class="list">
    <a class="card" href="시안1/"><span class="no">시안 1 · 피부관리·스파</span><h2>SOOM Skin &amp; Spa</h2><p>아이보리·세이지 톤의 차분한 고급형. 풀스크린 슬라이더와 시그니처 코스 소개.</p><span class="go">보러 가기 →</span></a>
    <a class="card" href="시안2/"><span class="no">시안 2 · 네일·속눈썹</span><h2>Moment Nail Lab</h2><p>흰 바탕과 체리 포인트의 매거진형. 가로 스크롤 갤러리와 이달의 컬러 체험.</p><span class="go">보러 가기 →</span></a>
    <a class="card" href="시안3/"><span class="no">시안 3 · 헤어살롱</span><h2>hairmood</h2><p>코랄·버터 컬러의 경쾌한 스타일. 비포·애프터와 단계별 예약 화면.</p><span class="go">보러 가기 →</span></a>
  </section>
</main>
</body>
</html>
